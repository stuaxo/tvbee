# Checks run before each commit: `pipx install pre-commit && pre-commit install`
# once; `pre-commit run --all-files` runs them by hand.
repos:
  - repo: local
    hooks:
      - id: clippy
        name: cargo clippy
        # as CI: every crate, feature and target; warnings fail
        entry: cargo clippy --workspace --all-features --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
