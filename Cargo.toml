[package]
name = "tveee"
version = "0.2.0"
edition = "2024"
# Debian 13's packaged Rust; the optional `ui` feature needs 1.88 (ratatui)
rust-version = "1.85"
description = "Command-line remote for Android TV over ADB (tested on Philips Android TV)"
license = "GPL-3.0-or-later"
authors = ["Stuart Axon"]
repository = "https://github.com/stuaxo/tveee"
readme = "README.md"
keywords = ["android-tv", "adb", "remote", "cli", "tv"]
categories = ["command-line-utilities"]

[dependencies]
# a local cache of what's read from the TV (guide, descriptions, ...); SQLite
# bundled, so no system library is needed (a C compiler is, to build it)
diesel = { version = "2.2", default-features = false, features = ["sqlite"] }
libsqlite3-sys = { version = ">=0.17.2, <0.31.0", features = ["bundled"] }
# reading the JSON TVs and apps answer with (JointSpace, Kodi, devtools)
serde_json = { version = "1", default-features = false, features = ["std"] }
ratatui = { version = "0.30.2", optional = true, features = ["unstable-rendered-line-info"] }
# the ui's preview panel: pictures in the terminal (sixel, kitty, iTerm2, or
# unicode half-blocks), and JPEG decoding for YouTube's storyboard frames
ratatui-image = { version = "11.1", optional = true, default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", optional = true, default-features = false, features = ["jpeg", "png"] }

[features]
default = []
# the engine front ends run on: what's on, actions, previews, on worker threads
engine = ["dep:image"]
# `tveee ui`: interactive terminal remote (pulls in ratatui + crossterm)
ui = ["engine", "dep:ratatui", "dep:ratatui-image"]

[profile.release]
strip = true

# Debian/Ubuntu package (cargo deb), built by the release workflow
[package.metadata.deb]
maintainer = "Stuart Axon <https://github.com/stuaxo>"
copyright = "2026, Stuart Axon"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
features = ["ui"]
# the release builds are static (musl): nothing to depend on but adb
depends = "adb"
recommends = "scrcpy"
extended-description = """\
Control an Android TV from the command line over ADB: launch apps, search,
open links, change volume, seek, see what is playing (with title and progress)
and the TV's memory and storage, and a full-screen terminal remote (tveee ui).
So far only tested on a Philips Android TV."""
assets = [
    ["target/release/tveee", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/tveee/README.md", "644"],
    [".env.example", "usr/share/doc/tveee/env.example", "644"],
]
