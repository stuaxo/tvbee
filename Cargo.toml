# The workspace: this package is the `tveee` binary (the command line, and the
# plugin list); crates/ holds the core and the terminal remote, plugins/ the
# vendor plugins.
[workspace]
members = ["crates/*", "plugins/*"]
resolver = "3"

[workspace.package]
edition = "2024"
# for current releases of diesel, the bundled SQLite and zip (their
# security fixes); the optional `ui` feature needs 1.90 (crates/tveee-tui)
rust-version = "1.89"
license = "GPL-3.0-or-later"
authors = ["Stuart Axon"]
repository = "https://github.com/stuaxo/tveee"

# Lints every crate follows ([lints] workspace = true in each).
[workspace.lints.rust]
# the one exception (setting the environment from .env) says so where it is
unsafe_code = "deny"

[workspace.lints.clippy]
# a few of clippy's pedantic lints, chosen for being cheap and catching
# real untidiness; the rest of pedantic is off
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
map_unwrap_or = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
uninlined_format_args = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"

[workspace.dependencies]
tveee-core = { path = "crates/tveee-core" }
tveee-tui = { path = "crates/tveee-tui" }
tveee-plugin-philips = { path = "plugins/philips" }
tveee-plugin-youtube = { path = "plugins/youtube" }
tveee-plugin-kodi = { path = "plugins/kodi" }
# a local cache of what's read from the TV (guide, descriptions, ...); SQLite
# bundled, so no system library is needed (a C compiler is, to build it)
diesel = { version = "2.4", default-features = false, features = ["sqlite"] }
libsqlite3-sys = { version = ">=0.39.0, <0.41.0", features = ["bundled"] }
# reading the JSON TVs and apps answer with (JointSpace, Kodi, devtools)
serde_json = { version = "1", default-features = false, features = ["std"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
# the ui's preview panel: pictures in the terminal (sixel, kitty, iTerm2, or
# unicode half-blocks), and JPEG decoding for YouTube's storyboard frames
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }

[package]
name = "tveee"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Command-line remote for Android TV over ADB (tested on Philips Android TV)"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["android-tv", "adb", "remote", "cli", "tv"]
categories = ["command-line-utilities"]

[dependencies]
tveee-core.workspace = true
tveee-plugin-philips.workspace = true
tveee-plugin-youtube.workspace = true
tveee-plugin-kodi.workspace = true
serde_json.workspace = true
tveee-tui = { workspace = true, optional = true }

[features]
default = []
# the engine front ends run on: what's on, actions, previews, on worker threads
engine = ["tveee-core/engine"]
# `tveee ui`: interactive terminal remote (pulls in ratatui + crossterm)
ui = ["engine", "dep:tveee-tui"]

[profile.release]
strip = true

# Debian/Ubuntu package (cargo deb), built by the release workflow
[package.metadata.deb]
maintainer = "Stuart Axon <https://github.com/stuaxo>"
copyright = "2026, Stuart Axon"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
features = ["ui"]
# the release builds are static (musl): nothing to depend on but adb
depends = "adb"
recommends = "scrcpy"
extended-description = """\
Control an Android TV from the command line over ADB: launch apps, search,
open links, change volume, seek, see what is playing (with title and progress)
and the TV's memory and storage, and a full-screen terminal remote (tveee ui).
So far only tested on a Philips Android TV."""
assets = [
    ["target/release/tveee", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/tveee/README.md", "644"],
    [".env.example", "usr/share/doc/tveee/env.example", "644"],
]

[lints]
workspace = true
