# cargo-deny (CI): licences, security advisories, where crates come from.
# Run it here with `cargo deny check`.

[graph]
all-features = true

[licenses]
# permissive licences, plus our own (GPL-3.0-or-later) for the workspace
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
    "Unicode-3.0",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[advisories]
# a crate no longer maintained is worth knowing, not a failure
unmaintained = "workspace"

[bans]
# the same crate twice in different versions: worth seeing, not a failure
multiple-versions = "allow"
# the workspace's own crates refer to each other by path (never published)
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
