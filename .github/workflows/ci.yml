name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # the main target: build, lint and test both feature sets
  linux:
    name: Linux (${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "ui"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings
      - run: cargo test --workspace --features "${{ matrix.features }}"

  # formatting, the docs (no broken links), and the core free of terminal
  # crates (so a GUI can use it: see the plan's gui.md)
  checks:
    name: Formatting, docs, core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: tveee-core pulls in no terminal crates
        run: |
          if cargo tree -p tveee-core -e normal --all-features | grep -E 'ratatui|crossterm'; then
            echo "tveee-core depends on a terminal crate (above): keep it in tveee-tui"; exit 1
          fi

  # licences, where crates come from, and security advisories
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # the oldest Rust we claim to support (Cargo.toml rust-version)
  msrv:
    name: Minimum Rust (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      # the terminal remote needs newer Rust (see crates/tveee-tui)
      - run: cargo test --workspace --exclude tveee-tui --locked

  windows:
    name: Windows (${{ matrix.features || 'default' }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "ui"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings
      - run: cargo test --workspace --features "${{ matrix.features }}"

  # the release's static Linux builds (musl), cross-compiled; the tests run
  # under qemu, which also catches 32-bit problems on the ARM ones
  linux-static:
    name: Static ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - arm-unknown-linux-musleabihf
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test --workspace --features ui
      - run: cargo build --release --features ui
      - name: Statically linked
        run: |
          f=$(file -L target/${{ matrix.target }}/release/tveee); echo "$f"
          echo "$f" | grep -Eq 'static(ally|-pie) linked'
