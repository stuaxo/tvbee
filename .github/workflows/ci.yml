name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # the main target: build, lint and test both feature sets
  linux:
    name: Linux (${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "ui"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings
      - run: cargo test --workspace --features "${{ matrix.features }}"

  # build with Debian's own packaged Rust (no rustup), as someone building
  # from source on Debian 13 would
  debian:
    name: Debian 13, packaged Rust
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      # ca-certificates: cargo fetches crates over HTTPS; gcc and libc6-dev
      # build the bundled SQLite
      - run: apt-get update && apt-get install -y --no-install-recommends cargo ca-certificates gcc libc6-dev curl
      - run: cargo --version && cargo build --locked && cargo test --workspace --exclude tveee-tui --locked

  # the oldest Rust we claim to support (Cargo.toml rust-version)
  msrv:
    name: Minimum Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # the terminal remote needs newer Rust (see crates/tveee-tui)
      - run: cargo test --workspace --exclude tveee-tui --locked

  windows:
    name: Windows (${{ matrix.features || 'default' }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "ui"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings
      - run: cargo test --workspace --features "${{ matrix.features }}"

  # the release's static Linux builds (musl), cross-compiled; the tests run
  # under qemu, which also catches 32-bit problems on the ARM ones
  linux-static:
    name: Static ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - arm-unknown-linux-musleabihf
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test --workspace --features ui
      - run: cargo build --release --features ui
      - name: Statically linked
        run: |
          f=$(file -L target/${{ matrix.target }}/release/tveee); echo "$f"
          echo "$f" | grep -Eq 'static(ally|-pie) linked'
