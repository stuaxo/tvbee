name: Release

# Push a tag like v0.1.0 (matching Cargo.toml's version) to publish a
# release with a Windows zip, and static Linux tarballs and .debs for x86_64
# and ARM (64-bit, and 32-bit for every Raspberry Pi).
on:
  push:
    tags: ["v[0-9]+.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1; }
      - uses: taiki-e/create-gh-release-action@v1
        with:
          title: tveee $version
          token: ${{ secrets.GITHUB_TOKEN }}

  # Windows, and static (musl) Linux builds: no glibc version to match, so
  # they run on any distribution and on things like a Synology NAS. Each
  # Linux build is also packaged as a .deb (Raspberry Pi OS, Debian, Ubuntu).
  binaries:
    needs: create-release
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            deb: true
          # 64-bit Raspberry Pi OS (Pi 3 and later), other arm64 boards
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            deb: true
          # 32-bit: ARMv6 with hard float, the baseline of Raspberry Pi OS's
          # armhf, so it runs on every Pi (Zero and 1 too) and ARMv7 boards
          - target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
            deb: true
          # 32-bit ARMv7 and later only, a little faster (Pi 2+, ARMv7 NAS)
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # the C cross compiler (for the bundled SQLite) and musl
      - uses: taiki-e/setup-cross-toolchain-action@v1
        if: contains(matrix.target, '-linux-')
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: tveee
          target: ${{ matrix.target }}
          build-tool: cargo
          features: ui
          archive: $bin-$tag-$target
          zip: windows
          tar: unix
          include: README.md,LICENSE,.env.example
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@v2
        if: matrix.deb
        with:
          tool: cargo-deb
      # packages the binary built above (amd64, arm64, armhf)
      - if: matrix.deb
        run: |
          deb=$(cargo deb --no-build --no-strip --target ${{ matrix.target }})
          gh release upload "$GITHUB_REF_NAME" "$deb"
        env:
          GH_TOKEN: ${{ github.token }}
