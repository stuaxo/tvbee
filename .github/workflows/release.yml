name: Release

# Push a tag like v0.1.0 (matching Cargo.toml's version) to publish a
# release with a Windows zip, a Linux tarball and a .deb.
on:
  push:
    tags: ["v[0-9]+.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1; }
      - uses: taiki-e/create-gh-release-action@v1
        with:
          title: tvbee $version
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: create-release
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # built on an older Ubuntu so it runs on Debian 12+ / Ubuntu 22.04+
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: tvbee
          target: ${{ matrix.target }}
          features: ui
          archive: $bin-$tag-$target
          zip: windows
          tar: unix
          include: README.md,LICENSE,.env.example
          token: ${{ secrets.GITHUB_TOKEN }}

  deb:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo deb
      - run: gh release upload "$GITHUB_REF_NAME" target/debian/*.deb
        env:
          GH_TOKEN: ${{ github.token }}
