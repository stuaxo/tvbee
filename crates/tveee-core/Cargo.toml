[package]
name = "tveee-core"
version = "0.2.0"
description = "tveee's core: talking to the TV, actions, plugins' building blocks, and the engine front ends run on"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
diesel.workspace = true
libsqlite3-sys.workspace = true
serde_json.workspace = true
image = { workspace = true, optional = true }

[features]
default = []
# the engine front ends run on: what's on, actions, previews, on worker threads
engine = ["dep:image"]
