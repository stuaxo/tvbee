[package]
name = "tveee-tui"
version = "0.4.0"
description = "tveee's terminal remote (tveee ui), on the core's engine"
edition.workspace = true
# ratatui needs 1.88, ratatui-image's quantette 1.90 (the rest of tveee
# builds with 1.89)
rust-version = "1.90"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
tveee-core = { workspace = true, features = ["engine"] }
ratatui.workspace = true
ratatui-image.workspace = true
image.workspace = true
nucleo-matcher = "0.3.1"

# the tests use real plugins' apps and providers (YouTube's search link, ...)
[dev-dependencies]
tveee-plugin-philips.workspace = true
tveee-plugin-youtube.workspace = true
tveee-plugin-kodi.workspace = true
insta = "1.49.0"

[lints]
workspace = true
